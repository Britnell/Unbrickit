<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New App with Framework</title>
</head>

<body class="">
  <div id="app">
    <div x-data="{page:'clock'}">
      <main>
        <div x-text="JSON.stringify()"></div>

        <clock-face @tick="$event"></clock-face>

        <div class="menu">
          <button x-show="!app.showMenu.value" @click="app.showMenu.value = !app.showMenu.value"
            class="absolute bottom-2 left-1/2 -translate-x-1/2 px-8 py-1 text-2xl">...</button>
          <div x-else
            class="absolute w-[300px] left-1/2 -translate-x-1/2 bottom-2 p-1 bg-[#fff8] rounded z-10 overflow-auto max-h-[calc(100svh-1rem)]">

            <!-- <span x-text="JSON.stringify(app.menuItems)"></span> -->
            <ul x-show="app.menu.value === ''" class="grid grid-cols-2">
              <button @click="app.showMenu.value = false">close</button>
              <template x-for="item in app.menuItems">
                <li>
                  <button @click="app.openMenu(item)" class="w-full px-2 py-3 rounded hover:bg-[#fff5]"
                    x-text="item.label"></button>
                  <!-- <button x-show="item.type === 'page'"
                    @click="page = page===item.key ? 'clock' : item.key, showMenu = false"
                    class="w-full px-2 py-3 rounded hover:bg-[#fff5]" x-text="item.label"></button> -->
                </li>
              </template>
            </ul>

            <div x-show="app.menu.value === 'theme'">
              <menu-theme></menu-theme>
            </div>
            <div x-show="app.menu.value === 'habit'">habit</div>
            <div x-show="app.menu.value === 'radio'">radio</div>
            <div x-show="app.menu.value === 'chime'">chime</div>
            <div x-show="app.menu.value === 'podcast'">podcast</div>
            <!-- <menu-theme x-show="menu==='theme'"></menu-theme>
            <menu-chime x-show="menu==='chime'"></menu-chime>
            <menu-habit x-show="menu==='habit'"></menu-habit>
            <menu-radio x-show="menu==='radio'"></menu-radio>
            <menu-podcast x-show="menu==='podcast'"></menu-podcast> -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <template id="clock-face">
    <div class="grid place-items-center h-screen" :style="{
      background: theme.bg.value,
      color: theme.text.value
    }">
      <span x-text="time.value" :style="{
        'font-size':theme.size.value+'vw',
        'font-weight': theme.weight.value
      }"></span>
    </div>
  </template>

  <template id="menu-theme">
    <div class="grid grid-cols-2 gap-y-1 gap-x-2">
      <div class=" col-span-full">
        <button @click="app.menu.value = ''" class="px-2 py-1 hover:bg-[#fff5]">← 🎨 Theme </button>
      </div>

        </select>
      </div> -->

      <!-- Weight Slider -->
      <div class="contents">
        <label for="weight-slider" class="flex justify-between items-center">
          Weight
          <span x-text="theme.weight.value" class="font-mono"></span>
        </label>
        <input type="range" id="weight-slider" x-model="theme.weight" min="100" max="900" step="100"
          class="col-span-full" />
      </div>

      <!-- hue -->
      <div class="contents">
        <label for="hue-slider" class="flex justify-between items-center">
          Hue
        </label>
        <span x-text="theme.hue.value + '°'" class="font-mono"></span>
        <input type="range" id="hue-slider" x-model="theme.hue" min="0" max="360" step="1" class=" col-span-full" />
      </div>

      <!-- Size Slider -->
      <div class="contents">
        <label for="size-slider" class="flex justify-between items-center">
          Size
        </label>
        <span x-text="theme.size.value" class="font-mono"></span>
        <input type="range" id="size-slider" x-model="theme.size" min="25" max="35" step="1" class="col-span-full" />
      </div>
    </div>
  </template>

  <script type="module" src="/src/new/main.ts"></script>
