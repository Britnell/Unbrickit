<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New App with Framework</title>
  <script type="module" src="/src/new/main.ts"></script>
</head>

<body class="">
  <div id="app">
    <div x-data="{page:'clock'}">
      <main>
        <div x-text="JSON.stringify()"></div>

        <clock-face @tick="$event"></clock-face>

        <div>
          <button x-show="!app.showMenu.value" @click="app.showMenu.value = !app.showMenu.value"
            class="absolute bottom-2 left-1/2 -translate-x-1/2 px-8 py-1 text-2xl">...</button>
          <div x-else
            class="absolute w-[300px] left-1/2 -translate-x-1/2 bottom-2 p-1 bg-[#fff8] rounded z-10 overflow-auto max-h-[calc(100svh-1rem)]">
            <ul x-show="app.menu.value === ''" class="grid grid-cols-2">
              <button @click="app.showMenu.value = false">close</button>
              <template x-for="item in app.menuItems">
                <li>
                  <button @click="app.openMenu(item)" class="w-full px-2 py-3 rounded hover:bg-[#fff5]"
                    x-text="item.label"></button>
                </li>
              </template>
            </ul>

            <menu-theme x-show="app.menu.value === 'theme'"></menu-theme>
            <div x-show="app.menu.value === 'chime'">
              <menu-item x-props="{name: 'chime'}">
                <p>asdasd</p>
              </menu-item>
            </div>


          </div>
        </div>

      </main>
    </div>
  </div>

  <template id="clock-face">
    <div class="grid place-items-center h-screen" :style="{
      background: theme.bg.value,
      color: theme.text.value
    }">
      <span x-text="time.value" :style="{
        'font-size':theme.size.value+'vw',
        'font-weight': theme.weight.value
      }" :class="'font-'+theme.font.value"></span>
    </div>
  </template>


  <template id="menu-item">
    <div class="grid grid-cols-2 gap-y-1 gap-x-2">
      <div class=" col-span-full">
        <button @click="app.menu.value = ''" class="px-2 py-1 hover:bg-[#fff5]">← 🎨
          <span x-text="name"></span>
        </button>
      </div>
      <slot></slot>
    </div>
  </template>

  <template id="menu-theme">
    <menu-item x-props="{name: 'theme'}">
      <!-- Size Slider -->
      <div class="contents">
        <label for="size-slider">
          Size
        </label>
        <span x-text="theme.size.value" class="font-mono"></span>
        <input type="range" id="size-slider" x-model="theme.size" min="25" max="35" step="1" class="col-span-full" />
      </div>

      <!-- Weight Slider -->
      <div class="contents">
        <label for="weight-slider">
          Weight
        </label>
        <span x-text="theme.weight.value" class="font-mono"></span>
        <input type="range" id="weight-slider" x-model="theme.weight" min="300" max="900" step="100"
          class="col-span-full" />
      </div>

      <!-- hue -->
      <div class="contents">
        <label for="hue-slider">
          Hue
        </label>
        <span x-text="theme.hue.value + '°'" class="font-mono"></span>
        <input type="range" id="hue-slider" x-model="theme.hue" min="0" max="360" step="1" class=" col-span-full" />
      </div>




      <!-- Dark Mode Checkbox -->
      <div class=" col-span-full flex items-center">
        <input type="checkbox" id="darkmode-checkbox" x-model="theme.invert" class="mr-2">
        <label for="darkmode-checkbox">Invert colours</label>
      </div>

      <!-- Color Mode Dropdown -->
      <div class="contents">
        <label for="colormode-select"> Color Mode </label>
        <select id="colormode-select" x-model="theme.colormode"
          class="w-full px-2 py-1 border border-gray-600 rounded-md bg-transparent"
          x-init="$nextTick(() => { $el.value = colormode })">
          <template x-for="cm in theme.colormodes" :key="cm">
            <option :value="cm" x-text="cm.charAt(0).toUpperCase() + cm.slice(1)"></option>
          </template>
        </select>
      </div>

      <!-- Font -->
      <div class="contents">
        <label for="font-select"> Font </label>
        <select id="font-select" x-model="theme.font"
          class="w-full px-2 py-1 border border-gray-600 rounded-md bg-transparent">
          <template x-for="f in theme.fonts">
            <option :value="f" x-text="f.charAt(0).toUpperCase() + f.slice(1)"></option>
          </template>
        </select>
      </div>

    </menu-item>

  </template>

</body>

</html>
